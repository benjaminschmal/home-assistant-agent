name: Fix UI JavaScript now
on:
  push:
    paths:
      - .github/workflows/fix-ui-js-now.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair UI script
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('agent/agent.py')
          s = p.read_text()
          bad = 'document.getElementById("versionInfo").textContent="Agent v\' + \'AGENT_VERSION" · MCP-Version nicht verfügbar"'
          good = 'document.getElementById("versionInfo").textContent=`Agent v${AGENT_VERSION} · MCP-Version nicht verfügbar`;'
          if bad not in s:
              raise SystemExit('Expected broken footer fallback was not found')
          s = s.replace(bad, good, 1)
          script = s.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/ui.js').write_text(script)
          p.write_text(s)
          PY
          node --check /tmp/ui.js
          git diff --check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent/agent.py
          git diff --cached --check
          git commit -m "fix: repair UI javascript syntax"
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-ui-js-now.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove temporary UI fix workflow"
          git push
