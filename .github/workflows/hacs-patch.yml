name: Apply HACS inspection patch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Apply HACS patch
        run: python3 scripts/patch_hacs.py
      - name: Commit changes and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcp-server/server.py agent/agent.py .github/workflows/hacs-patch.yml scripts/patch_hacs.py
          git commit -m "feat: add HACS environment inspection" || exit 0
          git push
