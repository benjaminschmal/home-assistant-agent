name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for agent
        id: meta-agent
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/benjaminschmal/home-assistant-agent

      - name: Build and push agent image
        uses: docker/build-push-action@v6
        with:
          context: ./agent
          push: true
          tags: |
            ghcr.io/benjaminschmal/home-assistant-agent:latest
            ghcr.io/benjaminschmal/home-assistant-agent:${{ github.sha }}
          labels: ${{ steps.meta-agent.outputs.labels }}

      - name: Extract Docker metadata for MCP server
        id: meta-mcp
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/benjaminschmal/home-assistant-mcp

      - name: Build and push MCP server image
        uses: docker/build-push-action@v6
        with:
          context: ./mcp-server
          push: true
          tags: |
            ghcr.io/benjaminschmal/home-assistant-mcp:latest
            ghcr.io/benjaminschmal/home-assistant-mcp:${{ github.sha }}
          labels: ${{ steps.meta-mcp.outputs.labels }}
